<script>
(()=>{'use strict';
// Add your Supabase project URL and publishable/anon key here. Never use a service_role key.
const SUPABASE_URL='https://twsbfueyesxuwwxghfim.supabase.co', SUPABASE_KEY='sb_publishable_bmpa-DMdjjYLdUwzToTpHg_cMMImVx3';
const CLOUD_READY=Boolean(SUPABASE_URL&&SUPABASE_KEY&&window.supabase);
const db=CLOUD_READY?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const KEY='rhino_learning_hub_v1', $=id=>document.getElementById(id),svg=n=>`<svg class="ico"><use href="#${n}"/></svg>`;
let lessons=[],editing=null,user=null,busy=false,loaded=false;
let tools=[],toolEditing=null,activeSection="lessons",toolBusy=false,toolsLoading=false,toolsRequest=0;
const TOOLS_KEY="rhino_tools_v1";
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ytId(raw){try{let u=new URL(raw),h=u.hostname.toLowerCase().replace(/^(www\.|m\.)/,'');let id='';if(h==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','youtube-nocookie.com'].includes(h)){id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|live|embed)\/([^/?]+)/)?.[1]||''}return /^[a-zA-Z0-9_-]{11}$/.test(id)?id:null}catch{return null}}
function localLoad(){try{let a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&typeof x.videoId==='string'):[]}catch{return []}}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(lessons));return true}catch{alert('تعذر الحفظ في المتصفح');return false}}
function normalize(row){return{id:row.id,title:row.title,url:row.url,videoId:row.video_id,position:row.position}}
function status(){const el=$('cloudStatus');el.textContent=!CLOUD_READY?'محلي':!user?'غير متصل':(busy||toolBusy)?'جاري الحفظ…':'متزامن';el.classList.toggle('connected',!!user&&!busy&&!toolBusy)}
async function refresh(){if(!user)return;const {data,error}=await db.from('rhino_lessons').select('id,title,url,video_id,position').order('position',{ascending:true});if(error){console.error(error);alert('تعذر تحميل الدروس من السحابة');return}lessons=data.map(normalize);loaded=true;render()}
function render(){status();$('count').textContent=lessons.length+' فيديو';$('lessons').innerHTML=lessons.map((x,i)=>`<article class="card"><a class="thumb" href="https://www.youtube.com/watch?v=${encodeURIComponent(x.videoId)}" target="_blank" rel="noopener noreferrer"><img src="https://img.youtube.com/vi/${encodeURIComponent(x.videoId)}/hqdefault.jpg" loading="lazy" alt=""><span class="number">#${String(i+1).padStart(2,'0')}</span><span class="play">${svg('play')}</span></a><div class="cardbody"><h3>${esc(x.title)}</h3><div class="cardbuttons"><button class="small edit" data-act="edit" data-id="${esc(x.id)}" title="تعديل">${svg('edit')}</button><button class="small delete" data-act="delete" data-id="${esc(x.id)}" title="حذف">${svg('trash')}</button></div></div></article>`).join('');renderSuggestions()}
function renderSuggestions(){const q=$('search').value.trim().toLocaleLowerCase(),menu=$('suggestions');if(!q){menu.hidden=true;menu.innerHTML='';return}const matches=lessons.filter(x=>x.title.toLocaleLowerCase().includes(q)).slice(0,9);menu.innerHTML=matches.map(x=>`<button type="button" class="suggestion" data-id="${esc(x.id)}"><img src="https://img.youtube.com/vi/${encodeURIComponent(x.videoId)}/mqdefault.jpg" alt=""><span>${esc(x.title)}</span></button>`).join('');menu.hidden=!matches.length}
function openEditor(x){editing=x?.id||null;$('modalTitle').textContent=x?'تعديل الفيديو':'إضافة فيديو';$('lessonForm').reset();if(x){$('url').value=x.url||'https://youtu.be/'+x.videoId;$('title').value=x.title}$('editor').showModal()}
async function requireCloud(){if(CLOUD_READY&&!user){$('accountDialog').showModal();return false}return true}
$('addBtn').onclick=async()=>{if(await requireCloud()){if(activeSection==='tools')openToolEditor();else openEditor()}};$('closeBtn').onclick=$('cancelBtn').onclick=()=>$('editor').close();
$('url').addEventListener('change',async()=>{let id=ytId($('url').value);if(!id||$('title').value.trim())return;try{let r=await fetch('https://www.youtube.com/oembed?url='+encodeURIComponent('https://www.youtube.com/watch?v='+id)+'&format=json');if(r.ok){let j=await r.json();if(ytId($('url').value)===id&&!$('title').value.trim())$('title').value=j.title||''}}catch{}});
$('lessonForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const videoId=ytId($('url').value),title=$('title').value.trim(),url=$('url').value.trim();if(!videoId||!title){alert('تأكد من الرابط والعنوان');return}busy=true;status();try{if(user){let existing=lessons.find(x=>x.id===editing),payload={title,url,video_id:videoId};let result;if(existing)result=await db.from('rhino_lessons').update(payload).eq('id',existing.id);else result=await db.from('rhino_lessons').insert({...payload,user_id:user.id,position:lessons.length?Math.max(...lessons.map(x=>x.position||0))+1:1});if(result.error)throw result.error;await refresh()}else{const old=[...lessons],item={id:editing||crypto.randomUUID(),url,title,videoId};if(editing){const i=lessons.findIndex(x=>x.id===editing);if(i<0)return;lessons[i]={...lessons[i],...item}}else lessons.push(item);if(!localSave()){lessons=old;return}render()}$('editor').close()}catch(err){alert('تعذر حفظ الفيديو: '+err.message)}finally{busy=false;status()}};
function askDelete(title){return new Promise(resolve=>{const d=$('deleteDialog');$('deleteName').textContent=title;let settled=false;const finish=v=>{if(settled)return;settled=true;d.close();resolve(v)};$('confirmDelete').onclick=()=>finish(true);$('cancelDelete').onclick=()=>finish(false);d.oncancel=e=>{e.preventDefault();finish(false)};d.showModal()})}
$('lessons').onclick=async e=>{const b=e.target.closest('button[data-act]');if(!b||busy)return;const i=lessons.findIndex(x=>x.id===b.dataset.id);if(i<0)return;const act=b.dataset.act;if(act==='edit')return openEditor(lessons[i]);if(act==='delete'&&!await askDelete(lessons[i].title))return;const old=lessons.map(x=>({...x}));busy=true;status();try{if(act==='delete'){if(user){const r=await db.from('rhino_lessons').delete().eq('id',lessons[i].id);if(r.error)throw r.error}else lessons.splice(i,1)}else{const j=i+(act==='up'?-1:1);if(j<0||j>=lessons.length)return;if(user){const first=lessons[i],second=lessons[j];const p1=first.position??i+1,p2=second.position??j+1;const r1=await db.from('rhino_lessons').update({position:p2}).eq('id',first.id);if(r1.error)throw r1.error;const r2=await db.from('rhino_lessons').update({position:p1}).eq('id',second.id);if(r2.error)throw r2.error}else [lessons[i],lessons[j]]=[lessons[j],lessons[i]]}if(user)await refresh();else if(!localSave())lessons=old;render()}catch(err){lessons=old;alert('تعذر تنفيذ العملية: '+err.message)}finally{busy=false;status()}};
$('search').oninput=renderSuggestions;$('suggestions').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const x=lessons.find(v=>v.id===b.dataset.id);if(x)window.open('https://www.youtube.com/watch?v='+encodeURIComponent(x.videoId),'_blank','noopener');$('suggestions').hidden=true;$('search').value=''};document.addEventListener('click',e=>{if(!$('searchWrap').contains(e.target))$('suggestions').hidden=true});
$('accountBtn').onclick=()=>{if(!CLOUD_READY){alert('المزامنة تحتاج ربط مشروع Supabase أولًا. النسخة الحالية تحفظ محليًا.');return}$('accountDialog').showModal()};$('closeAccount').onclick=()=>$('accountDialog').close();
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';if(!db)return;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){console.error('Supabase login error:',error);const m=String(error.message||'');$('loginError').textContent=/invalid login credentials/i.test(m)?'بيانات الدخول غير مقبولة من Supabase. تأكد أن الحساب موجود ضمن Authentication → Users وأن البريد مؤكد.':/email not confirmed/i.test(m)?'البريد الإلكتروني غير مؤكد. افتح Authentication → Users وتحقق من تأكيد الحساب.':/failed to fetch|network|fetch failed/i.test(m)?'تعذر الاتصال بـ Supabase. تحقق من الإنترنت وافتح الموقع من رابط HTTPS.':'خطأ تسجيل الدخول: '+(m||'غير معروف');return}$('accountDialog').close()};
$('logoutBtn').onclick=async()=>{if(db){await db.auth.signOut();$('accountDialog').close()}};
async function session(s){user=s?.user||null;$('loginForm').hidden=!!user;$('accountLogged').hidden=!user;$('userEmail').textContent=user?.email||'';if(user){await Promise.all([refresh(),refreshTools()])}else{++toolsRequest;tools=CLOUD_READY?[]:localTools();$('toolsError').hidden=true;renderTools();lessons=CLOUD_READY?[]:localLoad();loaded=true;render()}status()}
async function init(){if(!CLOUD_READY){lessons=localLoad();tools=localTools();render();renderTools();return}const {data}=await db.auth.getSession();await session(data.session);if(!data.session)$('accountDialog').showModal();db.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(()=>session(s),0)});setInterval(()=>{if(user&&!busy&&!toolBusy&&document.visibilityState==='visible'){refresh();if(!$('toolEditor').open&&!$('toolDeleteDialog').open)refreshTools()}},20000);document.addEventListener('visibilitychange',()=>{if(user&&!busy&&!toolBusy&&document.visibilityState==='visible'){refresh();if(!$('toolEditor').open&&!$('toolDeleteDialog').open)refreshTools()}})}
function localTools(){try{const a=JSON.parse(localStorage.getItem(TOOLS_KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.description==='string'):[]}catch{return []}}
function notifyTool(message){$('toolToast').textContent=message;$('toolToast').hidden=false;clearTimeout(notifyTool.timer);notifyTool.timer=setTimeout(()=>$('toolToast').hidden=true,2600)}
function changeSection(section){activeSection=section;const isTools=section==='tools';$('toolsPanel').hidden=!isTools;$('lessonsPanel').hidden=isTools;$('toolsTab').setAttribute('aria-selected',String(isTools));$('lessonsTab').setAttribute('aria-selected',String(!isTools));$('addBtn').innerHTML='<span class="add-medallion">'+svg('plus')+'</span>'+(isTools?'إضافة أداة':'إضافة فيديو');if(isTools)renderTools()}
$('toolsTab').onclick=()=>changeSection('tools');$('lessonsTab').onclick=()=>changeSection('lessons');$('toolSearch').oninput=renderTools;
function renderTools(){const q=$('toolSearch').value.trim().toLocaleLowerCase();const shown=tools.filter(x=>(x.name+' '+x.description).toLocaleLowerCase().includes(q));$('toolsCount').textContent=tools.length+' أداة';$('toolsGrid').innerHTML=shown.length?shown.map(x=>`<article class="card tool-card"><h3 class="tool-name" dir="auto">${esc(x.name)}</h3><p class="tool-description" dir="auto">${esc(x.description)}</p><div class="tool-actions"><button class="small" data-tool-act="copy" data-id="${esc(x.id)}" aria-label="نسخ اسم الأداة" title="نسخ اسم الأداة">⧉</button><button class="small" data-tool-act="edit" data-id="${esc(x.id)}" aria-label="تعديل الأداة" title="تعديل">${svg('edit')}</button><button class="small delete" data-tool-act="delete" data-id="${esc(x.id)}" aria-label="حذف الأداة" title="حذف">${svg('trash')}</button></div></article>`).join(''):`<div class="tools-empty"><h3>${toolsLoading?'جاري تحميل الأدوات…':q?'ما في أدوات مطابقة لبحثك':'أدواتك بمكان واحد'}</h3><p>${toolsLoading?'':q?'جرّب اسمًا أو كلمة مختلفة.':'كل أداة بتتعلمها، احفظ اسمها وشرحها هون وارجع إلها وقت ما بدك.'}</p></div>`}
function toolsFailure(error){return /42P01|PGRST205/.test(error?.code||'')?'قسم الأدوات بحاجة لتفعيل أول مرة. شغّل ملف tools-setup.sql في مشروع Supabase، ثم أعد تحميل الصفحة.':'تعذر حفظ أو تحميل الأدوات. تحقق من الاتصال وحاول مجددًا.'}
async function refreshTools(){if(!user||toolBusy)return;const uid=user.id,request=++toolsRequest;toolsLoading=true;renderTools();try{const {data,error}=await db.from('rhino_tools').select('id,name,description,created_at').eq('user_id',uid).order('created_at',{ascending:false});if(!user||user.id!==uid||request!==toolsRequest)return;if(error)throw error;tools=data||[];$('toolsError').hidden=true}catch(error){if(request!==toolsRequest)return;$('toolsError').textContent=toolsFailure(error);$('toolsError').hidden=false}finally{if(request===toolsRequest){toolsLoading=false;renderTools()}}}
function openToolEditor(item){toolEditing=item?.id||null;$('toolModalTitle').textContent=item?'تعديل الأداة':'إضافة أداة';$('toolForm').reset();$('toolFormError').textContent='';$('toolName').value=item?.name||'';$('toolDescription').value=item?.description||'';$('toolEditor').showModal();$('toolName').focus()}
function closeTool(){if(!toolBusy)$('toolEditor').close()}
$('closeTool').onclick=$('cancelTool').onclick=closeTool;$('toolEditor').oncancel=e=>{if(toolBusy)e.preventDefault()};
function toolSaving(value){toolBusy=value;$('saveTool').disabled=value;$('cancelTool').disabled=value;$('closeTool').disabled=value;$('confirmToolDelete').disabled=value;$('cancelToolDelete').disabled=value;$('saveTool').textContent=value?'جاري الحفظ…':'حفظ الأداة';status()}
$('toolForm').onsubmit=async e=>{e.preventDefault();if(toolBusy||!await requireCloud())return;const name=$('toolName').value.trim(),description=$('toolDescription').value.trim();if(!name||!description){$('toolFormError').textContent='اكتب اسم الأداة ووصفها.';return}const editingId=toolEditing;toolSaving(true);++toolsRequest;$('toolFormError').textContent='';try{let item;if(user){const payload={name,description};const r=editingId?await db.from('rhino_tools').update(payload).eq('id',editingId).eq('user_id',user.id).select('id,name,description,created_at').single():await db.from('rhino_tools').insert({...payload,user_id:user.id}).select('id,name,description,created_at').single();if(r.error)throw r.error;item=r.data}else item={id:editingId||crypto.randomUUID(),name,description,created_at:new Date().toISOString()};const next=editingId?tools.map(x=>x.id===editingId?item:x):[item,...tools];if(!user)localStorage.setItem(TOOLS_KEY,JSON.stringify(next));tools=next;toolsLoading=false;$('toolsError').hidden=true;renderTools();$('toolEditor').close();notifyTool(editingId?'تم تعديل الأداة':'تم حفظ الأداة')}catch(error){$('toolFormError').textContent=toolsFailure(error)}finally{toolSaving(false)}};
let toolDeleteId=null;
$('toolsGrid').onclick=async e=>{const b=e.target.closest('[data-tool-act]');if(!b||toolBusy)return;const x=tools.find(v=>v.id===b.dataset.id);if(!x)return;if(b.dataset.toolAct==='edit')return openToolEditor(x);if(b.dataset.toolAct==='copy'){try{await navigator.clipboard.writeText(x.name);notifyTool('تم نسخ اسم الأداة')}catch{notifyTool('تعذر النسخ؛ يمكنك تحديد الاسم ونسخه.')}return}toolDeleteId=x.id;$('toolDeleteName').textContent=x.name;$('toolDeleteError').textContent='';$('toolDeleteDialog').showModal()};
$('cancelToolDelete').onclick=()=>{if(!toolBusy)$('toolDeleteDialog').close()};$('toolDeleteDialog').oncancel=e=>{if(toolBusy)e.preventDefault()};
$('confirmToolDelete').onclick=async()=>{if(toolBusy||!toolDeleteId||!await requireCloud())return;toolSaving(true);++toolsRequest;try{if(user){const r=await db.from('rhino_tools').delete().eq('id',toolDeleteId).eq('user_id',user.id).select('id');if(r.error)throw r.error;if(!r.data?.length)throw new Error('not deleted')}const next=tools.filter(x=>x.id!==toolDeleteId);if(!user)localStorage.setItem(TOOLS_KEY,JSON.stringify(next));tools=next;toolsLoading=false;renderTools();$('toolDeleteDialog').close();notifyTool('تم حذف الأداة')}catch(error){$('toolDeleteError').textContent=toolsFailure(error)}finally{toolSaving(false)}};

init();
})();

<script>
(()=>{
const button=document.getElementById('installApp');
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
let installPrompt=null;
button.hidden=standalone();
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installPrompt=event;button.hidden=standalone()});
window.addEventListener('appinstalled',()=>{installPrompt=null;button.hidden=true});
button.addEventListener('click',async()=>{
 if(installPrompt){const prompt=installPrompt;installPrompt=null;try{await prompt.prompt();const choice=await prompt.userChoice;if(choice.outcome==='accepted')button.hidden=true}catch{button.hidden=standalone()}return;}
 if(location.protocol==='file:'){alert('للتثبيت، افتح الموقع من رابط GitHub Pages بعد رفع جميع ملفات التطبيق.');return;}
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 alert(ios?'افتح الرابط في Safari، ثم مشاركة ← إضافة إلى الشاشة الرئيسية.':'من قائمة المتصفح ⋮ أو ⋯ اختَر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». على الكمبيوتر استخدم Chrome أو Edge. إذا لم يظهر الخيار، أعد تحميل الصفحة بعد رفع ملفات التطبيق.');
});
if('serviceWorker' in navigator&&location.protocol==='https:'){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(error=>console.warn('App registration unavailable',error)));
}
})();
</script>
</body></html>
